name: learnly

services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    ports: ["127.0.0.1:27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z   # community MinIO fork, see ASSUMPTIONS A9
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-learnly}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-learnly-dev-secret-change-me}
    volumes: [minio-data:/data]
    ports:
      - "9000:9000"   # S3 API (browser presigned URLs, see ASSUMPTIONS A6)
      - "127.0.0.1:9091:9001"   # console
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio: { condition: service_healthy }
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-learnly}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-learnly-dev-secret-change-me}
    volumes: [./infra/minio/init.sh:/init.sh:ro]
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  cdn:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      minio-init: { condition: service_completed_successfully }
    environment:
      CDN_SECRET: ${CDN_SECRET:-cdn-dev-secret-change-me}
      NGINX_ENVSUBST_FILTER: CDN_
    volumes:
      - ./infra/cdn/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - cdn-cache:/var/cache/nginx/cdn
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/cdn-health"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.8
    restart: unless-stopped
    command: ["--dev", "--bind", "0.0.0.0"]
    environment:
      LIVEKIT_CONFIG: |
        rtc:
          port_range_start: 50000
          port_range_end: 50100
          tcp_port: 7881
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret-0123456789}"
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    restart: unless-stopped
    environment: &appenv
      MONGO_URI: mongodb://mongo:27017/learnly
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-learnly}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-learnly-dev-secret-change-me}
      CDN_SECRET: ${CDN_SECRET:-cdn-dev-secret-change-me}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_PUBLIC_URL: ${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-devsecret-devsecret-devsecret-0123456789}
      SMTP_HOST: mailpit
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    restart: unless-stopped
    environment: *appenv
    depends_on:
      api: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      cdn: { condition: service_healthy }
      web: { condition: service_started }
      api: { condition: service_healthy }
      mailpit: { condition: service_healthy }
    ports: ["${GATEWAY_PORT:-80}:80"]
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mongo-data:
  redis-data:
  minio-data:
  cdn-cache:
